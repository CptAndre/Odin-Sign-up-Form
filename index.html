<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin-Sign-up-Form</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="main">

        <section class="logo_section">

            <div class="logo_box">
                <img src="./img/odin-lined.png">
                <p>Odin</p>
            </div>

            <footer class="credits">
                <p>Photo by <a href="https://unsplash.com/photos/uma-area-gramada-com-montanhas-ao-fundo-mmaOKxzGXeA" target="_blank">Andrei R. Popescu</a> on <a href="https://unsplash.com" target="_blank">Unsplash</a></p>
            </footer>

        </section>

        <section class="sign_up_section">

            <div class="intro">
                
                <p>
                    This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.
                    Sign up to get started.
                </p>
                <p>You <i>know</i> you want to.</p>

            </div>

            <div class="sign_up">

                <p>Let's do this!</p>
                <form class="form_box">

                    <div class="input_type">
                        <label for="first_name">First Name:</label>
                        <input type="text">
                    </div>

                    <div class="input_type">
                        <label for="last_name">Last Name:</label>
                        <input type="text">
                    </div>

                    <div class="input_type">
                        <label for="email">Email:</label>
                        <input type="email">
                    </div>

                    <div class="input_type">
                        <label for="number">Phone Number:</label>
                        <input type="number">
                    </div>

                    <div class="input_type">
                        <label for="password">Password:</label>
                        <input type="password">
                    </div>

                    <div class="input_type">
                        <label for="passwordConfirm">Confirm Password:</label>
                        <input type="password">
                    </div>
                    

                </form>
            </div>

            <div class="button_confirm">

                <button>Create Account</button>
                <p>Already have an account? <a href="">Log in</a></p>

            </div>

        </section>

    </main>

</body>

</html>
